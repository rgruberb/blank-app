<title>Apê Zona Sul</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app de uma coluna para celular — cabeçalho fixo com a onda do calçadão, conteúdo, barra de abas embaixo. No computador a coluna fica centralizada. */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --surface-2: #e8eeee;
  --fg: #142322;
  --muted: #5b6b6a;
  --line: #d3dddc;
  --accent: #0a6f6a;
  --accent-ink: #ffffff;
  --accent-soft: #d5ecea;
  --new: #d0571f;
  --ok: #17803d;
  --ok-soft: #dcf2e3;
  --bad: #b9381b;
  --bad-soft: #fbe3dc;
  --sea: #cfe3e6;
  --metro: #1f5fae;
  --pin-seen: #8a9a98;
  --c1: #0a6f6a; --c2: #3d9b8f; --c3: #8fc6bd; --c4: #c9a227;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1615; --surface: #16211f; --surface-2: #1e2c2a; --fg: #e6efee; --muted: #93a5a3;
    --line: #2a3a38; --accent: #4cc3b6; --accent-ink: #062120; --accent-soft: #173a37; --new: #ff9a5c;
    --ok: #5fd08a; --ok-soft: #173826; --bad: #ff8a6b; --bad-soft: #3d1f17; --sea: #142a2d; --metro: #7fb0f0; --pin-seen: #5d6e6c;
    --c1: #4cc3b6; --c2: #2f8f84; --c3: #7fb7ae; --c4: #e0bd4a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1615; --surface: #16211f; --surface-2: #1e2c2a; --fg: #e6efee; --muted: #93a5a3;
  --line: #2a3a38; --accent: #4cc3b6; --accent-ink: #062120; --accent-soft: #173a37; --new: #ff9a5c;
  --ok: #5fd08a; --ok-soft: #173826; --bad: #ff8a6b; --bad-soft: #3d1f17; --sea: #142a2d; --metro: #7fb0f0; --pin-seen: #5d6e6c;
  --c1: #4cc3b6; --c2: #2f8f84; --c3: #7fb7ae; --c4: #e0bd4a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { padding-block: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; margin: 0; min-width: 0; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.wave { display: block; width: 100%; height: 8px; color: var(--fg); opacity: .85; }
.filter-pill { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }

main { padding-block: 16px; display: flex; flex-direction: column; gap: 14px; }
h2.view-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: -6px 0 0; font-size: 14px; }
.notice { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.linkish { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 6px 2px; }

/* Cartões */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.card.unseen { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.card.seen .card-main, .card.disc .card-main { opacity: .6; }
.card-main { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; background: none; border: 0; padding: 14px 14px 10px; }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: baseline; }
.dot-new { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-1px); }
.card .meta { grid-column: 1; color: var(--muted); font-size: 13px; }
.card .price { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
.card .price b { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.card .price span { font-size: 12px; color: var(--muted); }
.card .tags { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--line); }
.card-actions button { border: 0; background: none; padding: 10px 4px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; }
.card-actions button + button { border-left: 1px solid var(--line); }
.card-actions button[aria-pressed="true"] { color: var(--accent); }
.card-actions button.disc[aria-pressed="true"] { color: var(--bad); }
.card-actions svg { width: 16px; height: 16px; }
.tag { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: var(--surface-2); color: var(--muted); }
.tag.new { background: var(--new); color: var(--surface); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.mark { background: var(--accent-soft); color: var(--accent); }
.tag.ex { border: 1px dashed var(--muted); background: transparent; }
.empty { text-align: center; padding: 28px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty strong { color: var(--fg); font-size: 16px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 16px; font-weight: 600; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); }
.btn.block { width: 100%; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.disc[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.row-btns .btn { flex: 1 1 140px; }

nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabbar .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
nav.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
nav.tabbar button svg { width: 22px; height: 22px; }
nav.tabbar button[aria-current="page"] { color: var(--accent); }
nav.tabbar .add span.plus { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.panel ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-weight: 400; color: var(--fg); width: 100%; min-height: 44px; }
.field textarea { min-height: 90px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; font-weight: 500; }
.switch input { width: 46px; height: 28px; appearance: none; background: var(--line); border-radius: 999px; position: relative; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.budget-out { font-family: var(--font-display); font-size: 28px; font-weight: 800; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }

.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.sheet-head .inner { max-width: 560px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.sheet-body { max-width: 560px; margin: 0 auto; padding-block: 16px calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.total-big { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.total-big b { font-family: var(--font-display); font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); }
.stack span { display: block; height: 100%; }
.breakdown { display: flex; flex-direction: column; }
.breakdown .ln { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.breakdown .ln:last-child { border-bottom: 0; font-weight: 700; }
.breakdown .dot { width: 10px; height: 10px; border-radius: 3px; }
.breakdown .pct { color: var(--muted); font-size: 12px; min-width: 34px; text-align: right; }
.meter { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 5px; }
.verdict { font-weight: 600; font-size: 14px; border-radius: 10px; padding: 10px 12px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; text-align: right; font-weight: 500; overflow-wrap: anywhere; }
.price-hist { font-size: 13px; color: var(--muted); }

.site-list { display: flex; flex-direction: column; gap: 10px; }
.bairro-links { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.bairro-links strong { font-family: var(--font-display); font-size: 17px; }
.bairro-links .links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bairro-links a { text-align: center; text-decoration: none; font-size: 13px; font-weight: 600; padding: 10px 6px; border-radius: 10px; background: var(--surface-2); color: var(--fg); min-height: 40px; }

/* Mapa */
.map-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: relative; }
.map-wrap svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.map-canvas { position: relative; }
.map-zoom { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 6px; }
.map-zoom button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 600; line-height: 1; }
.map-info { padding: 12px 14px; border-top: 1px solid var(--line); font-size: 14px; min-height: 64px; display: flex; flex-direction: column; gap: 8px; }
.map-info .title { font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.pin { cursor: pointer; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="top-inner gutter">
      <h1 class="brand">Apê Zona Sul<small id="sub">Carregando…</small></h1>

    <svg class="wave" viewBox="0 0 120 8" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="calcadao" width="24" height="8" patternUnits="userSpaceOnUse"><path d="M0 4 C6 -1, 6 9, 12 4 S18 -1, 24 4" fill="none" stroke="currentColor" stroke-width="2.2"/></pattern></defs>
      <rect width="120" height="8" fill="url(#calcadao)"/>

    <button type="button" data-tab="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>

    <button type="button" data-tab="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Sites</button>
    <button type="button" data-tab="filtros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtros</button>

<div class="sheet" id="sheet" hidden></div>

<script>
(() => {
// ------------------------------------------------------------ dados fixos
const BAIRROS = {
  "Botafogo": ["botafogo", -22.9519, -43.1840], "Catete": ["catete", -22.9258, -43.1767],
  "Copacabana": ["copacabana", -22.9711, -43.1863], "Cosme Velho": ["cosme-velho", -22.9400, -43.1980],
  "Flamengo": ["flamengo", -22.9330, -43.1750], "Gávea": ["gavea", -22.9775, -43.2280],
  "Glória": ["gloria", -22.9200, -43.1760], "Humaitá": ["humaita", -22.9550, -43.2000],
  "Ipanema": ["ipanema", -22.9838, -43.2046], "Jardim Botânico": ["jardim-botanico", -22.9670, -43.2240],
  "Lagoa": ["lagoa", -22.9665, -43.2045], "Laranjeiras": ["laranjeiras", -22.9350, -43.1880],
  "Leblon": ["leblon", -22.9847, -43.2240], "Leme": ["leme", -22.9630, -43.1690],
  "São Conrado": ["sao-conrado", -22.9935, -43.2560], "Urca": ["urca", -22.9500, -43.1650],
};
const NOMES_BAIRROS = Object.keys(BAIRROS);
const METRO = [
  ["Glória", -22.9213, -43.1763], ["Catete", -22.9263, -43.1767], ["Largo do Machado", -22.9311, -43.1780],
  ["Flamengo", -22.9379, -43.1782], ["Botafogo", -22.9510, -43.1838], ["Cardeal Arcoverde", -22.9644, -43.1803],
  ["Siqueira Campos", -22.9675, -43.1867], ["Cantagalo", -22.9764, -43.1938], ["General Osório", -22.9846, -43.1977],
  ["Nossa Senhora da Paz", -22.9840, -43.2066], ["Jardim de Alah", -22.9838, -43.2156],
  ["Antero de Quental", -22.9840, -43.2235], ["São Conrado", -22.9925, -43.2545],
];
const GARANTIAS = ["Caução (3 aluguéis)", "Seguro fiança", "Título de capitalização", "Fiador", "Sem garantia"];
const EXIGENCIAS = [["vaga", "Vaga de garagem"], ["aceita_pet", "Aceita pet"], ["mobiliado", "Mobiliado"], ["perto_metro", "Perto do metrô"]];
const FILTROS_PADRAO = { quartos: [1, 2], orcamento: 5000, bairros: [...NOMES_BAIRROS], exige: [] };
const DIAS_ANTIGO = 21;

const fmt = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const brl = v => fmt.format(Math.round(v || 0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = v => Number(v) || 0;
const dias = iso => iso ? (Date.now() - new Date(iso).getTime()) / 864e5 : Infinity;
const dataCurta = iso => iso ? new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : "";
const quandoFoi = iso => {
  if (!iso) return "";
  const d = new Date(iso), hoje = new Date(); const ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
  const h = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === hoje.toDateString()) return "hoje às " + h;
  if (d.toDateString() === ontem.toDateString()) return "ontem às " + h;
  return "em " + dataCurta(iso);
};
const siteDe = url => { try { const h = new URL(url).hostname; return h.includes("quintoandar") ? "QuintoAndar" : h.includes("zap") ? "ZAP Imóveis" : h.includes("vivareal") ? "VivaReal" : h.includes("olx") ? "OLX" : h.includes("imovelweb") ? "Imovelweb" : h.replace(/^www\./, ""); } catch { return "Anúncio"; } };

// ------------------------------------------------------------ custos
function custoMensal(a) {
  const partes = [
    ["Aluguel", n(a.aluguel), "var(--c1)"],
    ["Condomínio", n(a.condominio), "var(--c2)"],
    ["IPTU (anual ÷ 12)", n(a.iptu_anual) / 12, "var(--c3)"],
    ["Seguro incêndio (anual ÷ 12)", n(a.seguro_incendio_anual) / 12, "var(--c4)"],
  ];
  return { partes, total: partes.reduce((s, p) => s + p[1], 0) };
}
function custoEntrada(a) {
  const aluguel = n(a.aluguel), total = custoMensal(a).total;
  const g = a.garantia || GARANTIAS[0];
  let valor = 0, nota = "sem custo direto";
  if (g.startsWith("Caução")) { valor = 3 * aluguel; nota = "devolvido no fim do contrato, corrigido"; }
  else if (g.startsWith("Seguro")) { valor = 1.2 * total; nota = "estimativa por ano; não é devolvido"; }
  else if (g.startsWith("Título")) { valor = 6 * aluguel; nota = "estimativa; resgatável no fim"; }
  return { garantia: a.garantia ? g : g + " (estimado)", valor, nota, primeiro: total, total: valor + total };
}
function linksBusca(bairro, quartos, orc) {
  const slug = BAIRROS[bairro][0], qs = (quartos.length ? quartos : [1, 2]);
  const p = new URLSearchParams({ quartos: qs.join(","), precoMaximo: orc }).toString();
  const termo = `aluguel apartamento ${qs.join(" ou ")} quartos ${bairro} Rio de Janeiro`;
  return [
    ["QuintoAndar", `https://www.quintoandar.com.br/alugar/imovel/${slug}-rio-de-janeiro-rj-brasil/apartamento/de-${Math.min(...qs)}-quartos/ate-${orc}-reais`],
    ["ZAP Imóveis", `https://www.zapimoveis.com.br/aluguel/apartamentos/rj+rio-de-janeiro+zona-sul+${slug}/?${p}`],
    ["VivaReal", `https://www.vivareal.com.br/aluguel/rj/rio-de-janeiro/zona-sul/${slug}/apartamento_residencial/?${p}`],
    ["Google / OLX", "https://www.google.com/search?" + new URLSearchParams({ q: termo })],
  ];
}

// ------------------------------------------------------------ estado
const state = {
  tab: "lista", aptos: [], filtros: { ...FILTROS_PADRAO }, coleta: null, carregado: false, avisoLento: false,
  ver: "abertos", ordem: "novos", store: "local", editando: null, aberto: null,
  mapa: { sel: null, vb: null },
};
// Compatibilidade com o formato antigo (status) e com links únicos
function norm(d) {
  const a = { ...d };
  if (a.status === "Descartado") a.descartado = true;
  if (a.status && a.status !== "Novo" && a.status !== "Descartado") a.visto = true;
  a.links = Array.isArray(a.links) && a.links.length ? a.links : (a.link ? [{ site: siteDe(a.link), url: a.link }] : []);
  return a;
}
const passa = a => {
  const f = state.filtros;
  if (!f.quartos.includes(n(a.quartos))) return false;
  if (!f.bairros.includes(a.bairro)) return false;
  if (custoMensal(a).total > f.orcamento) return false;
  return f.exige.every(k => a[k] === true);
};
const ehNovo = a => !a.visto && !a.descartado && dias(a.encontrado_em) <= 1.5;
const visiveis = () => state.aptos.filter(a => passa(a) && (state.ver === "descartados" ? a.descartado : !a.descartado) && (state.ver !== "naovistos" || !a.visto));

// ------------------------------------------------------------ armazenamento (db do Artifact; o navegador é a reserva)
const LS_KEY = "ape-zona-sul-v1";
const local = {
  read() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } },
  write(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch {} },
};
let db = null, filtrosTimer = null, salvandoFiltros = false, ultimaMudanca = 0;
const fila = {}; // uma escrita por vez por documento
function escrever(id, fn) { const p = (fila[id] || Promise.resolve()).catch(() => {}).then(fn); fila[id] = p; return p; }
const store = {
  async add(a) {
    if (db) return db.collection("apartamentos").add(a);
    const d = local.read(); d.aptos = d.aptos || []; a.id = "l" + Date.now(); d.aptos.push(a); local.write(d); carregarLocal();
  },
  async update(id, ch) {
    const ap = state.aptos.find(x => x.id === id); if (ap) Object.assign(ap, ch); // resposta imediata na tela
    if (db) return escrever(id, () => db.doc("apartamentos/" + id).update(ch));
    const d = local.read(); d.aptos = (d.aptos || []).map(x => x.id === id ? { ...x, ...ch } : x); local.write(d); carregarLocal();
  },
  async remove(id) {
    if (db) return escrever(id, () => db.doc("apartamentos/" + id).delete());
    const d = local.read(); d.aptos = (d.aptos || []).filter(x => x.id !== id); local.write(d); carregarLocal();
  },
  salvarFiltros() {
    ultimaMudanca = Date.now();
    clearTimeout(filtrosTimer);
    filtrosTimer = setTimeout(async () => {
      if (!db) { const d = local.read(); d.filtros = state.filtros; local.write(d); return; }
      if (salvandoFiltros) return store.salvarFiltros();
      salvandoFiltros = true;
      try { await db.doc("config/filtros").set({ ...state.filtros }); } catch {} finally { salvandoFiltros = false; }
    }, 700);
  },
};
function carregarLocal() {
  const d = local.read();
  state.aptos = (d.aptos || []).map(norm);
  if (d.filtros) state.filtros = { ...FILTROS_PADRAO, ...d.filtros };
  state.carregado = true; render();
}
async function iniciarDb() {
  let api = null;
  try { api = window.claude?.use ? await window.claude.use("db") : null; } catch { api = null; }
  if (!api) { state.store = "local"; carregarLocal(); return; }
  db = api; state.store = "db";
  const timer = setTimeout(() => { state.avisoLento = true; render(); }, 10000);
  db.collection("apartamentos").onSnapshot(snap => {
    state.aptos = snap.docs.map(d => norm({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { clearTimeout(timer); state.avisoLento = false; }
    state.carregado = true; render();
  }, () => { clearTimeout(timer); state.carregado = true; state.avisoLento = true; render(); });
  db.doc("config/filtros").onSnapshot(snap => {
    if (!snap.exists || salvandoFiltros || Date.now() - ultimaMudanca < 3000) return;
    const remoto = { ...FILTROS_PADRAO, ...snap.data() };
    if (JSON.stringify(remoto) !== JSON.stringify(state.filtros)) { state.filtros = remoto; render(); }
  }, () => {});
  db.doc("config/coleta").onSnapshot(snap => { state.coleta = snap.exists ? snap.data() : null; renderCabecalho(); }, () => {});
}

function renderCabecalho() {
  const c = state.coleta, f = state.filtros;
  const sub = c?.ultima_execucao ? `Atualizado ${quandoFoi(c.ultima_execucao)}` :
    `${f.quartos.length ? f.quartos.join(" ou ") : "—"} quarto${f.quartos.join() === "1" ? "" : "s"} · ${f.bairros.length} bairro${f.bairros.length === 1 ? "" : "s"}`;
  document.getElementById("sub").textContent = sub;
  document.getElementById("pill").textContent = "até " + brl(f.orcamento);
}
function render() {
  renderCabecalho();
  document.querySelectorAll("nav.tabbar button").forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const views = { lista: viewLista, mapa: viewMapa, novo: viewForm, buscar: viewBuscar, filtros: viewFiltros };
  if (state.tab === "novo" && $view.dataset.tab === "novo") return; // não apagar o formulário enquanto digita
  $view.dataset.tab = state.tab;
  $view.innerHTML = views[state.tab]();
  if (state.tab === "mapa") ligarMapa();
  if (!$sheet.hidden && state.aberto && !document.activeElement?.dataset?.obs) abrirDetalhe(state.aberto, true);

function tagsDe(a, curto) {
  const t = [];
  if (ehNovo(a)) t.push(`<span class="tag new">Novo</span>`);
  if (a.exemplo) t.push(`<span class="tag ex">Exemplo</span>`);
  if (a.visto) t.push(`<span class="tag mark">Visto</span>`);
  if (a.descartado) t.push(`<span class="tag bad">Descartado</span>`);
  if (a.observacoes) t.push(`<span class="tag mark">Com observação</span>`);
  if (!passa(a)) t.push(`<span class="tag bad">${custoMensal(a).total > state.filtros.orcamento ? "Acima do orçamento" : "Fora dos filtros"}</span>`);
  if (a.links.length > 1) t.push(`<span class="tag">${a.links.length} sites</span>`);
  if (dias(a.ultimo_alerta || a.encontrado_em) > DIAS_ANTIGO && a.fonte !== "Manual") t.push(`<span class="tag">Anúncio antigo</span>`);
  if (!curto) {

    if (a.mobiliado) t.push(`<span class="tag">Mobiliado</span>`);
    if (a.perto_metro) t.push(`<span class="tag">Metrô</span>`);
  }
  return t.join("");
}
const fontes = a => a.links.length ? [...new Set(a.links.map(l => l.site || siteDe(l.url)))].join(", ") : (a.fonte || "Manual");

      ${state.editando ? `<button class="btn" type="button" data-act="cancelar-edicao">Cancelar</button>` : ""}
      <button class="btn primary" type="submit">${state.editando ? "Salvar alterações" : "Salvar apartamento"}</button>
    </div>
  </form>`;
}
function lerForm(form) {
  const fd = new FormData(form), o = {};
  for (const k of ["titulo", "bairro", "endereco", "garantia"]) o[k] = String(fd.get(k) || "").trim();
  for (const k of ["quartos", "area_m2", "aluguel", "condominio", "iptu_anual", "seguro_incendio_anual"]) o[k] = n(fd.get(k));
  for (const [k] of EXIGENCIAS) o[k] = fd.get(k) === "on";
  const link = String(fd.get("link") || "").trim();
  o.links = link ? [{ site: siteDe(link), url: link }] : [];
  return o;
}
function atualizarPreviaTotal() {
  const form = document.getElementById("form-apto"); if (!form) return;
  const o = lerForm(form), t = custoMensal(o).total;
  document.getElementById("f-total").textContent = t ? `Total por mês: ${brl(t)} (${t <= state.filtros.orcamento ? "cabe" : "não cabe"} no orçamento de ${brl(state.filtros.orcamento)})` : "";
}

function viewBuscar() {
  const f = state.filtros;
  return `<h2 class="view-title">Sites</h2>
  <section class="panel">
    <h3>Como criar os alertas</h3>
    <p class="hint" style="margin:0;font-size:13px">Os anúncios chegam ao app pelos alertas que os sites mandam para o seu Gmail. Faça isto uma vez em cada site:</p>
    <ol>
      <li>Entre no site com a sua conta, usando o mesmo e-mail do Gmail.</li>

    : `<div class="empty"><strong>Nenhum bairro escolhido</strong><button class="btn" type="button" data-go="filtros">Escolher bairros</button></div>`}`;
}

function viewFiltros() {
  const f = state.filtros;
  return `<h2 class="view-title">Filtros</h2>
  <p class="lede">Valem para a lista e o mapa${state.store === "db" ? ", e ficam iguais no celular e no computador" : ""}.</p>
  <section class="panel"><h3>Quartos</h3>
    <div class="chips">${[1, 2].map(q => `<button type="button" class="chip" data-quarto="${q}" aria-pressed="${f.quartos.includes(q)}">${q} quarto${q > 1 ? "s" : ""}</button>`).join("")}</div>

  </section>
  <section class="panel"><h3>Bairros da Zona Sul</h3>
    <div class="row-btns"><button class="btn" type="button" data-act="bairros-todos">Marcar todos</button><button class="btn" type="button" data-act="bairros-nenhum">Limpar</button></div>
    <div class="chips">${NOMES_BAIRROS.map(b => `<button type="button" class="chip" data-bairro="${b}" aria-pressed="${f.bairros.includes(b)}">${b}</button>`).join("")}</div>
  </section>
  <section class="panel"><h3>Exigências</h3>
    <p class="hint" style="margin:0">Com uma exigência ligada, somem os anúncios que não informam esse item.</p>
    ${EXIGENCIAS.map(([k, t]) => `<label class="switch">${t}<input type="checkbox" id="x-${k}" data-exige="${k}"${f.exige.includes(k) ? " checked" : ""}></label>`).join("")}
  </section>`;
}

// ------------------------------------------------------------ mapa por apartamento
const MW = 600, MH = 470, LON0 = -43.268, LON1 = -43.158, LAT0 = -23.002, LAT1 = -22.912;
const px = lon => (lon - LON0) / (LON1 - LON0) * MW;
const py = lat => (LAT1 - lat) / (LAT1 - LAT0) * MH;
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }
function posicao(a) {
  if (n(a.lat) && n(a.lon)) return { x: px(a.lon), y: py(a.lat), aprox: !!a.local_aproximado };
  const b = BAIRROS[a.bairro]; if (!b) return null;
  const h = hash(a.id), ang = (h % 360) * Math.PI / 180, r = 6 + (Math.abs(h) % 14);
  return { x: px(b[2]) + Math.cos(ang) * r, y: py(b[1]) + Math.sin(ang) * r, aprox: true };
}
function viewMapa() {
  const vb = state.mapa.vb || [0, 0, MW, MH];
  const k = vb[2] / MW; // escala: mantém pinos e textos do mesmo tamanho na tela
  const lista = visiveis().map(a => ({ a, p: posicao(a) })).filter(o => o.p);
  lista.sort((p, q) => (!!q.a.visto - !!p.a.visto)); // não vistos por cima
  const sel = state.aptos.find(a => a.id === state.mapa.sel);
  const linha = METRO.map(([, la, lo]) => `${px(lo).toFixed(1)},${py(la).toFixed(1)}`).join(" ");
  const aprox = lista.filter(o => o.p.aprox).length;
  const info = sel ? `<div class="title">${esc(sel.titulo)}</div>
      <div class="num">${esc(sel.bairro)} · ${n(sel.quartos)} qto${n(sel.quartos) > 1 ? "s" : ""} · <b>${brl(custoMensal(sel).total)}</b>/mês</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${tagsDe(sel, true)}</div>
      <div class="row-btns"><button class="btn" type="button" data-mark="visto" data-id="${esc(sel.id)}" aria-pressed="${!!sel.visto}">${sel.visto ? "✓ Visto" : "Marcar visto"}</button><button class="btn primary" type="button" data-open="${esc(sel.id)}">Ver detalhes</button></div>`
    : `<span class="hint">Toque num ponto para ver o apartamento. Arraste para mover o mapa e use + e − para aproximar.</span>`;
  return `<h2 class="view-title">Mapa</h2>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Quais mostrar">
      <button type="button" data-ver="abertos" aria-pressed="${state.ver === "abertos"}">Todos</button>
      <button type="button" data-ver="naovistos" aria-pressed="${state.ver === "naovistos"}">Não vistos</button>
      <button type="button" data-ver="descartados" aria-pressed="${state.ver === "descartados"}">Descartados</button>
    </div>
  </div>
  <div class="legend"><span><i style="background:var(--accent)"></i>Não visto</span><span><i style="background:var(--pin-seen)"></i>Visto</span><span><i style="background:transparent;border:2px dashed var(--muted)"></i>Local aproximado</span><span><i style="background:var(--metro)"></i>Metrô</span></div>
  <div class="map-wrap">
    <div class="map-canvas"><svg id="mapa" viewBox="${vb.join(" ")}" role="img" aria-label="Mapa esquemático da Zona Sul com os apartamentos">
      <rect x="-2000" y="-2000" width="5000" height="5000" fill="var(--surface)"/>
      <path d="M-600 ${MH + 600} L-600 ${py(-22.9995)} L${px(-43.235)} ${py(-22.9885)} L${px(-43.1935)} ${py(-22.9875)} L${px(-43.1885)} ${py(-22.9800)} L${px(-43.1720)} ${py(-22.9660)} L${px(-43.1640)} ${py(-22.9640)} L${MW + 600} ${py(-22.9580)} L${MW + 600} ${MH + 600} Z" fill="var(--sea)"/>
      <path d="M${MW + 600} ${py(-22.9530)} L${px(-43.1680)} ${py(-22.9480)} L${px(-43.1760)} ${py(-22.9440)} L${px(-43.1720)} ${py(-22.9300)} L${px(-43.1700)} ${py(-22.9150)} L${px(-43.1690)} -600 L${MW + 600} -600 Z" fill="var(--sea)"/>
      <ellipse cx="${px(-43.2115)}" cy="${py(-22.9735)}" rx="27" ry="31" fill="var(--sea)"/>
      <polyline points="${linha}" fill="none" stroke="var(--metro)" stroke-width="${3 * k}" stroke-linejoin="round" opacity=".5"/>
      ${METRO.map(([nome, la, lo]) => `<circle cx="${px(lo)}" cy="${py(la)}" r="${3 * k}" fill="var(--surface)" stroke="var(--metro)" stroke-width="${1.6 * k}"><title>Estação ${nome}</title></circle>`).join("")}
      ${NOMES_BAIRROS.map(b => { const [, la, lo] = BAIRROS[b], on = state.filtros.bairros.includes(b);
        return `<text x="${px(lo)}" y="${py(la)}" text-anchor="middle" font-size="${12 * k}" font-weight="700" fill="${on ? "var(--fg)" : "var(--muted)"}" opacity="${on ? .55 : .35}" letter-spacing="${.5 * k}" style="text-transform:uppercase;pointer-events:none">${b}</text>`; }).join("")}
      ${lista.map(({ a, p }) => {
        const cor = a.descartado ? "var(--bad)" : a.visto ? "var(--pin-seen)" : "var(--accent)";
        const r = (a.id === state.mapa.sel ? 12 : 9) * k;
        return `<g class="pin" data-pin="${esc(a.id)}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r * 2}" fill="transparent"/>
          <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${p.aprox ? "var(--surface)" : cor}" stroke="${p.aprox ? cor : a.id === state.mapa.sel ? "var(--fg)" : "var(--surface)"}" stroke-width="${(p.aprox ? 2.5 : 2) * k}" ${p.aprox ? `stroke-dasharray="${3 * k} ${2 * k}"` : ""}/>
          ${ehNovo(a) ? `<circle cx="${(p.x + r * .75).toFixed(1)}" cy="${(p.y - r * .75).toFixed(1)}" r="${3 * k}" fill="var(--new)"/>` : ""}</g>`;
      }).join("")}
    </svg>
    <div class="map-zoom"><button type="button" data-zoom="0.6" aria-label="Aproximar">+</button><button type="button" data-zoom="1.6" aria-label="Afastar">−</button><button type="button" data-zoom="0" aria-label="Ver tudo" style="font-size:13px">⤢</button></div></div>
    <div class="map-info">${info}</div>
  </div>
  <p class="hint">${lista.length} apartamento${lista.length === 1 ? "" : "s"} no mapa, dentro dos filtros.${aprox ? ` ${aprox} com local aproximado (pontilhado): o anúncio não trazia a rua, então o ponto fica perto do centro do bairro.` : ""} Mapa esquemático; o desenho do mar e das ruas é simplificado.</p>`;
}
function zoomEm(fator, cx, cy) {
  let [x, y, w, h] = state.mapa.vb || [0, 0, MW, MH];
  if (!fator) { state.mapa.vb = null; return; }
  const nw = Math.min(MW * 1.2, Math.max(MW * 0.08, w * fator)), f = nw / w, nh = h * f;
  cx ??= x + w / 2; cy ??= y + h / 2;
  state.mapa.vb = [cx - (cx - x) * f, cy - (cy - y) * f, nw, nh];
}
function ligarMapa() {
  const svg = document.getElementById("mapa"); if (!svg) return;
  const ptrs = new Map(); let alvo = null, arrastou = false, inicio = null, distIni = 0, vbIni = null;
  const vbAtual = () => state.mapa.vb || [0, 0, MW, MH];
  const paraSvg = (cx, cy, vb) => { const r = svg.getBoundingClientRect(); return [vb[0] + (cx - r.left) / r.width * vb[2], vb[1] + (cy - r.top) / r.height * vb[3]]; };
  svg.addEventListener("pointerdown", e => {
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    alvo = e.target.closest?.("[data-pin]")?.dataset.pin ?? null;
    arrastou = false; inicio = [e.clientX, e.clientY]; vbIni = [...vbAtual()];
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; distIni = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  });
  svg.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    const r = svg.getBoundingClientRect();
    if (ptrs.size === 1) {
      const dx = e.clientX - inicio[0], dy = e.clientY - inicio[1];
      if (!arrastou && Math.hypot(dx, dy) > 6) { arrastou = true; try { svg.setPointerCapture(e.pointerId); } catch {} }
      if (!arrastou) return;
      const vb = [vbIni[0] - dx / r.width * vbIni[2], vbIni[1] - dy / r.height * vbIni[3], vbIni[2], vbIni[3]];
      state.mapa.vb = vb; svg.setAttribute("viewBox", vb.join(" "));
    } else if (ptrs.size === 2 && distIni) {
      arrastou = true;
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const [cx, cy] = paraSvg((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, vbIni);
      state.mapa.vb = [...vbIni]; zoomEm(distIni / d, cx, cy); svg.setAttribute("viewBox", state.mapa.vb.join(" "));
    }
  });
  const fim = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0 && arrastou) return render(); // redesenha os pinos no tamanho certo
    if (ptrs.size === 0 && e.type === "pointerup") { state.mapa.sel = alvo; return render(); } // toque simples

    if (ptrs.size === 1) { const [p] = ptrs.values(); inicio = p; vbIni = [...vbAtual()]; distIni = 0; }
  };
  svg.addEventListener("pointerup", fim); svg.addEventListener("pointercancel", fim);
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const [cx, cy] = paraSvg(e.clientX, e.clientY, vbAtual());
    zoomEm(e.deltaY > 0 ? 1.2 : 0.83, cx, cy); render();
  }, { passive: false });
}

// ------------------------------------------------------------ eventos
function irPara(tab) {
  if (tab !== "novo") state.editando = null;
  state.tab = tab; $view.dataset.tab = ""; render(); window.scrollTo(0, 0);
  if (tab === "novo") atualizarPreviaTotal();
}
function alternarMarca(id, campo) {
  const a = state.aptos.find(x => x.id === id); if (!a) return;
  const ch = { [campo]: !a[campo] };
  if (campo === "descartado" && ch.descartado) ch.visto = true;
  if (a.status) ch.status = null;
  store.update(id, ch).catch(() => {});
  render();
}
document.querySelector("nav.tabbar").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  if (b.dataset.tab === "novo") state.editando = null;
  irPara(b.dataset.tab);
});
document.getElementById("pill").addEventListener("click", () => irPara("filtros"));

$view.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-go],[data-act],[data-quarto],[data-bairro],[data-mark],[data-ver],[data-zoom]"); if (!t) return;
  const f = state.filtros;
  if (t.dataset.mark) return alternarMarca(t.dataset.id, t.dataset.mark);
  if (t.dataset.open) return abrirDetalhe(t.dataset.open, false, t.dataset.foco);
  if (t.dataset.go) return irPara(t.dataset.go);
  if (t.dataset.ver) { state.ver = t.dataset.ver; return render(); }
  if (t.dataset.zoom !== undefined) { zoomEm(+t.dataset.zoom); return render(); }
  if (t.dataset.act === "ordem") { state.ordem = state.ordem === "preco" ? "novos" : "preco"; return render(); }
  if (t.dataset.quarto) { const q = +t.dataset.quarto; f.quartos = f.quartos.includes(q) ? f.quartos.filter(x => x !== q) : [...f.quartos, q].sort(); }
  else if (t.dataset.bairro) { const b = t.dataset.bairro; f.bairros = f.bairros.includes(b) ? f.bairros.filter(x => x !== b) : NOMES_BAIRROS.filter(x => x === b || f.bairros.includes(x)); }
  else if (t.dataset.act === "bairros-todos") f.bairros = [...NOMES_BAIRROS];
  else if (t.dataset.act === "bairros-nenhum") f.bairros = [];
  else if (t.dataset.act === "cancelar-edicao") { const id = state.editando; state.editando = null; irPara("lista"); if (id) abrirDetalhe(id); return; }
  else return;
  store.salvarFiltros(); render();
});
$view.addEventListener("input", e => {
  if (e.target.id === "orc") {
    state.filtros.orcamento = +e.target.value;
    document.getElementById("orc-out").textContent = brl(state.filtros.orcamento);
    document.getElementById("pill").textContent = "até " + brl(state.filtros.orcamento);
    store.salvarFiltros();
  }
  if (e.target.closest("#form-apto")) atualizarPreviaTotal();
});
$view.addEventListener("change", e => {
  const k = e.target.dataset.exige; if (!k) return;
  const f = state.filtros;
  f.exige = e.target.checked ? [...new Set([...f.exige, k])] : f.exige.filter(x => x !== k);
  store.salvarFiltros(); render();
});
$view.addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, o = lerForm(form), err = document.getElementById("f-err");
  if (!o.titulo || !o.aluguel) { err.textContent = "Preencha pelo menos o título e o aluguel."; return; }
  const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Salvando…";
  try {
    if (state.editando) { const id = state.editando; await store.update(id, o); state.editando = null; irPara("lista"); abrirDetalhe(id); }
    else { await store.add({ ...o, fonte: "Manual", visto: true, descartado: false, observacoes: "", encontrado_em: new Date().toISOString() }); irPara("lista"); }
  } catch (x) {
    err.textContent = x?.code === "quota_exceeded" ? "Limite de armazenamento atingido. Apague apartamentos antigos e tente de novo." : "Não consegui salvar. Confira a conexão e tente de novo.";
    btn.disabled = false; btn.textContent = "Tentar de novo";
  }
});

let obsTimer = null, armado = false;
$sheet.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-mark]"); if (!t) return;
  const id = state.aberto;
  if (t.dataset.mark) { alternarMarca(id, t.dataset.mark); abrirDetalhe(id, true); return; }
  if (t.dataset.act === "fechar") { armado = false; return fecharDetalhe(); }
  if (t.dataset.act === "editar") { state.editando = id; fecharDetalhe(); state.tab = "novo"; $view.dataset.tab = ""; render(); atualizarPreviaTotal(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "remover") {
    if (!armado) { armado = true; t.classList.add("armed"); t.textContent = "Toque de novo para apagar"; setTimeout(() => { armado = false; if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Apagar"; } }, 4000); return; }
    armado = false; fecharDetalhe(); try { await store.remove(id); } catch {}
  }
});
$sheet.addEventListener("input", e => {
  const id = e.target.dataset.obs; if (!id) return;
  const valor = e.target.value; document.getElementById("obs-status").textContent = "Salvando…";
  clearTimeout(obsTimer);
  obsTimer = setTimeout(async () => {
    try { await store.update(id, { observacoes: valor }); const s = document.getElementById("obs-status"); if (s) s.textContent = "Salvo"; }
    catch { const s = document.getElementById("obs-status"); if (s) s.textContent = "Não consegui salvar a observação."; }
  }, 800);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$sheet.hidden) fecharDetalhe(); });

render();
iniciarDb();
})();
</script>
