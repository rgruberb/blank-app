<title>Apê Zona Sul</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app de uma coluna para celular — cabeçalho fixo com a onda do calçadão, conteúdo, barra de abas embaixo. No computador a coluna fica centralizada. */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --surface-2: #e8eeee;
  --fg: #142322;
  --muted: #5b6b6a;
  --line: #d3dddc;
  --accent: #0a6f6a;
  --accent-ink: #ffffff;
  --accent-soft: #d5ecea;
  --ok: #17803d;
  --ok-soft: #dcf2e3;
  --bad: #b9381b;
  --bad-soft: #fbe3dc;
  --sea: #cfe3e6;
  --metro: #1f5fae;
  --c1: #0a6f6a; --c2: #3d9b8f; --c3: #8fc6bd; --c4: #c9a227;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1615; --surface: #16211f; --surface-2: #1e2c2a; --fg: #e6efee; --muted: #93a5a3;
    --line: #2a3a38; --accent: #4cc3b6; --accent-ink: #062120; --accent-soft: #173a37;
    --ok: #5fd08a; --ok-soft: #173826; --bad: #ff8a6b; --bad-soft: #3d1f17; --sea: #142a2d; --metro: #7fb0f0;
    --c1: #4cc3b6; --c2: #2f8f84; --c3: #7fb7ae; --c4: #e0bd4a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1615; --surface: #16211f; --surface-2: #1e2c2a; --fg: #e6efee; --muted: #93a5a3;
  --line: #2a3a38; --accent: #4cc3b6; --accent-ink: #062120; --accent-soft: #173a37;
  --ok: #5fd08a; --ok-soft: #173826; --bad: #ff8a6b; --bad-soft: #3d1f17; --sea: #142a2d; --metro: #7fb0f0;
  --c1: #4cc3b6; --c2: #2f8f84; --c3: #7fb7ae; --c4: #e0bd4a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabeçalho */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { padding-block: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; margin: 0; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.wave { display: block; width: 100%; height: 8px; color: var(--fg); opacity: .85; }
.filter-pill { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }

main { padding-block: 16px; display: flex; flex-direction: column; gap: 14px; }
h2.view-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: -6px 0 0; font-size: 14px; }
.notice { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }

/* Lista */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card.fora { opacity: .62; }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.card .meta { grid-column: 1; color: var(--muted); font-size: 13px; }
.card .price { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
.card .price b { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.card .price span { font-size: 12px; color: var(--muted); }
.card .tags { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: var(--surface-2); color: var(--muted); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.status { background: var(--accent-soft); color: var(--accent); }
.tag.ex { border: 1px dashed var(--muted); background: transparent; }
.empty { text-align: center; padding: 28px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty strong { color: var(--fg); font-size: 16px; }

/* Botões */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 16px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); }
.btn.block { width: 100%; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.row-btns .btn { flex: 1 1 140px; }

/* Barra de abas */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabbar .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
nav.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
nav.tabbar button svg { width: 22px; height: 22px; }
nav.tabbar button[aria-current="page"] { color: var(--accent); }
nav.tabbar .add span.plus { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }

/* Formulários */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-weight: 400; color: var(--fg); width: 100%; min-height: 44px; }
.field textarea { min-height: 80px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; font-weight: 500; }
.switch input { width: 46px; height: 28px; appearance: none; background: var(--line); border-radius: 999px; position: relative; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.budget-out { font-family: var(--font-display); font-size: 28px; font-weight: 800; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }

/* Detalhe */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.sheet-head .inner { max-width: 560px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.sheet-body { max-width: 560px; margin: 0 auto; padding-block: 16px calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.total-big { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.total-big b { font-family: var(--font-display); font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); }
.stack span { display: block; height: 100%; }
.breakdown { display: flex; flex-direction: column; }
.breakdown .ln { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.breakdown .ln:last-child { border-bottom: 0; font-weight: 700; }
.breakdown .dot { width: 10px; height: 10px; border-radius: 3px; }
.breakdown .pct { color: var(--muted); font-size: 12px; min-width: 34px; text-align: right; }
.meter { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 5px; }
.verdict { font-weight: 600; font-size: 14px; border-radius: 10px; padding: 10px 12px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; text-align: right; font-weight: 500; overflow-wrap: anywhere; }

/* Buscar */
.site-list { display: flex; flex-direction: column; gap: 10px; }
.bairro-links { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.bairro-links strong { font-family: var(--font-display); font-size: 17px; }
.bairro-links .links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bairro-links a { text-align: center; text-decoration: none; font-size: 13px; font-weight: 600; padding: 10px 6px; border-radius: 10px; background: var(--surface-2); color: var(--fg); min-height: 40px; }

/* Mapa */
.map-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.map-wrap svg { display: block; width: 100%; height: auto; }
.map-info { padding: 12px 14px; border-top: 1px solid var(--line); font-size: 14px; min-height: 64px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="top-inner gutter">
      <h1 class="brand">Apê Zona Sul<small id="sub">Carregando…</small></h1>
      <button class="filter-pill num" id="pill" type="button">Filtros</button>
    </div>
    <svg class="wave" viewBox="0 0 120 8" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="calcadao" width="24" height="8" patternUnits="userSpaceOnUse"><path d="M0 4 C6 -1, 6 9, 12 4 S18 -1, 24 4" fill="none" stroke="currentColor" stroke-width="2.2"/></pattern></defs>
      <rect width="120" height="8" fill="url(#calcadao)"/>
    </svg>
  </header>
  <main class="gutter" id="view"></main>
</div>

<nav class="tabbar" aria-label="Seções">
  <div class="inner">
    <button type="button" data-tab="lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Lista</button>
    <button type="button" data-tab="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
    <button type="button" data-tab="novo" class="add" aria-label="Adicionar apartamento"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button type="button" data-tab="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Buscar</button>
    <button type="button" data-tab="filtros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtros</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden></div>

<script>
(() => {
// ------------------------------------------------------------ dados fixos
const BAIRROS = {
  "Botafogo": ["botafogo", -22.9519, -43.1840], "Catete": ["catete", -22.9258, -43.1767],
  "Copacabana": ["copacabana", -22.9711, -43.1863], "Cosme Velho": ["cosme-velho", -22.9400, -43.1980],
  "Flamengo": ["flamengo", -22.9330, -43.1750], "Gávea": ["gavea", -22.9775, -43.2280],
  "Glória": ["gloria", -22.9200, -43.1760], "Humaitá": ["humaita", -22.9550, -43.2000],
  "Ipanema": ["ipanema", -22.9838, -43.2046], "Jardim Botânico": ["jardim-botanico", -22.9670, -43.2240],
  "Lagoa": ["lagoa", -22.9665, -43.2045], "Laranjeiras": ["laranjeiras", -22.9350, -43.1880],
  "Leblon": ["leblon", -22.9847, -43.2240], "Leme": ["leme", -22.9630, -43.1690],
  "São Conrado": ["sao-conrado", -22.9935, -43.2560], "Urca": ["urca", -22.9500, -43.1650],
};
const NOMES_BAIRROS = Object.keys(BAIRROS);
const METRO = [
  ["Glória", -22.9213, -43.1763], ["Catete", -22.9263, -43.1767], ["Largo do Machado", -22.9311, -43.1780],
  ["Flamengo", -22.9379, -43.1782], ["Botafogo", -22.9510, -43.1838], ["Cardeal Arcoverde", -22.9644, -43.1803],
  ["Siqueira Campos", -22.9675, -43.1867], ["Cantagalo", -22.9764, -43.1938], ["General Osório", -22.9846, -43.1977],
  ["Nossa Senhora da Paz", -22.9840, -43.2066], ["Jardim de Alah", -22.9838, -43.2156],
  ["Antero de Quental", -22.9840, -43.2235], ["São Conrado", -22.9925, -43.2545],
];
const STATUS = ["Novo", "Visitar", "Visitado", "Proposta enviada", "Descartado"];
const GARANTIAS = ["Caução (3 aluguéis)", "Seguro fiança", "Título de capitalização", "Fiador", "Sem garantia"];
const EXIGENCIAS = [["vaga", "Vaga de garagem"], ["aceita_pet", "Aceita pet"], ["mobiliado", "Mobiliado"], ["perto_metro", "Perto do metrô"]];
const FILTROS_PADRAO = { quartos: [1, 2], orcamento: 5000, bairros: [...NOMES_BAIRROS], exige: [] };

const fmt = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const brl = v => fmt.format(Math.round(v || 0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = v => Number(v) || 0;

// ------------------------------------------------------------ custos
function custoMensal(a) {
  const partes = [
    ["Aluguel", n(a.aluguel), "var(--c1)"],
    ["Condomínio", n(a.condominio), "var(--c2)"],
    ["IPTU (anual ÷ 12)", n(a.iptu_anual) / 12, "var(--c3)"],
    ["Seguro incêndio (anual ÷ 12)", n(a.seguro_incendio_anual) / 12, "var(--c4)"],
  ];
  return { partes, total: partes.reduce((s, p) => s + p[1], 0) };
}
function custoEntrada(a) {
  const aluguel = n(a.aluguel), total = custoMensal(a).total;
  const g = a.garantia || GARANTIAS[0];
  let valor = 0, nota = "sem custo direto";
  if (g.startsWith("Caução")) { valor = 3 * aluguel; nota = "devolvido no fim do contrato, corrigido"; }
  else if (g.startsWith("Seguro")) { valor = 1.2 * total; nota = "estimativa por ano; não é devolvido"; }
  else if (g.startsWith("Título")) { valor = 6 * aluguel; nota = "estimativa; resgatável no fim"; }
  return { garantia: g, valor, nota, primeiro: total, total: valor + total };
}
function links(bairro, quartos, orc) {
  const slug = BAIRROS[bairro][0], qs = (quartos.length ? quartos : [1, 2]);
  const qmin = Math.min(...qs);
  const p = new URLSearchParams({ quartos: qs.join(","), precoMaximo: orc }).toString();
  const termo = `aluguel apartamento ${qs.join(" ou ")} quartos ${bairro} Rio de Janeiro`;
  return [
    ["QuintoAndar", `https://www.quintoandar.com.br/alugar/imovel/${slug}-rio-de-janeiro-rj-brasil/apartamento/de-${qmin}-quartos/ate-${orc}-reais`],
    ["ZAP Imóveis", `https://www.zapimoveis.com.br/aluguel/apartamentos/rj+rio-de-janeiro+zona-sul+${slug}/?${p}`],
    ["VivaReal", `https://www.vivareal.com.br/aluguel/rj/rio-de-janeiro/zona-sul/${slug}/apartamento_residencial/?${p}`],
    ["Google / OLX", "https://www.google.com/search?" + new URLSearchParams({ q: termo })],
  ];
}

// ------------------------------------------------------------ estado
const state = {
  tab: "lista", aptos: [], filtros: { ...FILTROS_PADRAO }, carregado: false, avisoLento: false,
  mostrarTodos: false, mapaSel: null, editando: null, store: "local",
};
const passa = a => {
  const f = state.filtros;
  if (!f.quartos.includes(n(a.quartos))) return false;
  if (!f.bairros.includes(a.bairro)) return false;
  if (custoMensal(a).total > f.orcamento) return false;
  return f.exige.every(k => a[k]);
};

// ------------------------------------------------------------ armazenamento (db do Artifact, ou o navegador como reserva)
const LS_KEY = "ape-zona-sul-v1";
const local = {
  read() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } },
  write(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch {} },
};
let db = null, filtrosTimer = null, salvandoFiltros = false, ultimaMudanca = 0;
const store = {
  async add(a) {
    if (db) return db.collection("apartamentos").add(a);
    const d = local.read(); d.aptos = d.aptos || []; a.id = "l" + Date.now(); d.aptos.push(a); local.write(d); carregarLocal();
  },
  async update(id, ch) {
    if (db) return db.doc("apartamentos/" + id).update(ch);
    const d = local.read(); d.aptos = (d.aptos || []).map(x => x.id === id ? { ...x, ...ch } : x); local.write(d); carregarLocal();
  },
  async remove(id) {
    if (db) return db.doc("apartamentos/" + id).delete();
    const d = local.read(); d.aptos = (d.aptos || []).filter(x => x.id !== id); local.write(d); carregarLocal();
  },
  salvarFiltros() {
    ultimaMudanca = Date.now();
    clearTimeout(filtrosTimer);
    filtrosTimer = setTimeout(async () => {
      if (!db) { const d = local.read(); d.filtros = state.filtros; local.write(d); return; }
      if (salvandoFiltros) return store.salvarFiltros();
      salvandoFiltros = true;
      try { await db.doc("config/filtros").set({ ...state.filtros }); } catch {} finally { salvandoFiltros = false; }
    }, 700);
  },
};
function carregarLocal() {
  const d = local.read();
  state.aptos = d.aptos || [];
  if (d.filtros) state.filtros = { ...FILTROS_PADRAO, ...d.filtros };
  state.carregado = true; render();
}

async function iniciarDb() {
  let api = null;
  try { api = window.claude?.use ? await window.claude.use("db") : null; } catch { api = null; }
  if (!api) { state.store = "local"; carregarLocal(); return; }
  db = api; state.store = "db";
  const timer = setTimeout(() => { state.avisoLento = true; render(); }, 10000);
  db.collection("apartamentos").onSnapshot(snap => {
    state.aptos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { clearTimeout(timer); state.avisoLento = false; }
    state.carregado = true; render();
  }, () => { clearTimeout(timer); state.carregado = true; state.avisoLento = true; render(); });
  db.doc("config/filtros").onSnapshot(snap => {
    if (!snap.exists || salvandoFiltros || Date.now() - ultimaMudanca < 3000) return;
    const remoto = { ...FILTROS_PADRAO, ...snap.data() };
    if (JSON.stringify(remoto) !== JSON.stringify(state.filtros)) { state.filtros = remoto; render(); }
  }, () => {});
}

const $view = document.getElementById("view");

function render() {
  const f = state.filtros;
  document.getElementById("sub").textContent =
    `${f.quartos.length ? f.quartos.join(" ou ") : "—"} quarto${f.quartos.length === 1 && f.quartos[0] === 1 ? "" : "s"} · ${f.bairros.length} bairro${f.bairros.length === 1 ? "" : "s"}`;
  document.getElementById("pill").textContent = "até " + brl(f.orcamento);
  document.querySelectorAll("nav.tabbar button").forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const views = { lista: viewLista, mapa: viewMapa, novo: viewForm, buscar: viewBuscar, filtros: viewFiltros };
  // Não redesenhar o formulário enquanto a pessoa digita
  if (state.tab === "novo" && $view.dataset.tab === "novo") return;
  $view.dataset.tab = state.tab;
  $view.innerHTML = views[state.tab]();
  if (!$sheet.hidden && state.aberto) abrirDetalhe(state.aberto, true);
}

function tagsDe(a) {
  const t = [];
  if (a.exemplo) t.push(`<span class="tag ex">Exemplo</span>`);
  t.push(passa(a) ? `<span class="tag ok">Dentro dos filtros</span>` : `<span class="tag bad">${custoMensal(a).total > state.filtros.orcamento ? "Acima do orçamento" : "Fora dos filtros"}</span>`);
  if (a.status && a.status !== "Novo") t.push(`<span class="tag status">${esc(a.status)}</span>`);
  if (a.vaga) t.push(`<span class="tag">Vaga</span>`);
  if (a.aceita_pet) t.push(`<span class="tag">Pet</span>`);
  if (a.mobiliado) t.push(`<span class="tag">Mobiliado</span>`);
  if (a.perto_metro) t.push(`<span class="tag">Metrô</span>`);
  return t.join("");
}

  for (const k of ["quartos", "area_m2", "aluguel", "condominio", "iptu_anual", "seguro_incendio_anual"]) o[k] = n(fd.get(k));
  for (const [k] of EXIGENCIAS) o[k] = fd.get(k) === "on";
  return o;
}

          <circle cx="${x(lo)}" cy="${y(la)}" r="${r}" fill="${na ? "var(--accent)" : "var(--line)"}" fill-opacity="${na ? .85 : .9}" stroke="${sel === b ? "var(--fg)" : "var(--surface)"}" stroke-width="${sel === b ? 3 : 2}"/>
          ${p.n ? `<text x="${x(lo)}" y="${+y(la) + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="${na ? "var(--accent-ink)" : "var(--fg)"}">${p.n}</text>` : ""}
          <text x="${x(lo)}" y="${+y(la) - r - 5}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--fg)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${b}</text>
        </g>`;
      }).join("")}
    </svg>
    <div class="map-info">${info}</div>
  </div>
  <p class="hint">Mapa esquemático: cada bairro aparece no seu centro aproximado. O número dentro do círculo é quantos apartamentos você salvou ali, sem contar os descartados.</p>
  ${resumo.length ? `<div class="table-wrap"><table class="num"><thead><tr><th>Bairro</th><th class="r">Salvos</th><th class="r">Nos filtros</th><th class="r">Mais barato</th><th class="r">Mediana</th></tr></thead><tbody>
    ${resumo.map(b => `<tr><td>${b}</td><td class="r">${porBairro[b].n}</td><td class="r">${porBairro[b].ok}</td><td class="r">${brl(porBairro[b].min)}</td><td class="r">${brl(porBairro[b].med)}</td></tr>`).join("")}
  </tbody></table></div>` : ""}`;
}

// ------------------------------------------------------------ eventos
function irPara(tab) {
  if (tab !== "novo") state.editando = null;
  state.tab = tab; $view.dataset.tab = ""; render(); window.scrollTo(0, 0);
  if (tab === "novo") atualizarPreviaTotal();
}
document.querySelector("nav.tabbar").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  if (b.dataset.tab === "novo") state.editando = null;
  irPara(b.dataset.tab);
});
document.getElementById("pill").addEventListener("click", () => irPara("filtros"));

$view.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-go],[data-act],[data-quarto],[data-bairro],[data-mapa]"); if (!t) return;
  const f = state.filtros;
  if (t.dataset.open) return abrirDetalhe(t.dataset.open);
  if (t.dataset.go) return irPara(t.dataset.go);
  if (t.dataset.mapa) { state.mapaSel = t.dataset.mapa; return render(); }
  if (t.dataset.quarto) { const q = +t.dataset.quarto; f.quartos = f.quartos.includes(q) ? f.quartos.filter(x => x !== q) : [...f.quartos, q].sort(); }
  else if (t.dataset.bairro) { const b = t.dataset.bairro; f.bairros = f.bairros.includes(b) ? f.bairros.filter(x => x !== b) : NOMES_BAIRROS.filter(x => x === b || f.bairros.includes(x)); }
  else if (t.dataset.act === "mostrar") { state.mostrarTodos = t.dataset.v === "1"; return render(); }
  else if (t.dataset.act === "bairros-todos") f.bairros = [...NOMES_BAIRROS];
  else if (t.dataset.act === "bairros-nenhum") f.bairros = [];
  else if (t.dataset.act === "toggle-bairro") { const b = t.dataset.b; f.bairros = f.bairros.includes(b) ? f.bairros.filter(x => x !== b) : NOMES_BAIRROS.filter(x => x === b || f.bairros.includes(x)); }
  else if (t.dataset.act === "cancelar-edicao") { const id = state.editando; state.editando = null; irPara("lista"); if (id) abrirDetalhe(id); return; }
  else return;
  store.salvarFiltros(); render();
});
$view.addEventListener("input", e => {
  if (e.target.id === "orc") {
    state.filtros.orcamento = +e.target.value;
    document.getElementById("orc-out").textContent = brl(state.filtros.orcamento);
    document.getElementById("pill").textContent = "até " + brl(state.filtros.orcamento);
    store.salvarFiltros();
  }
  if (e.target.closest("#form-apto")) atualizarPreviaTotal();
});
$view.addEventListener("change", e => {
  const k = e.target.dataset.exige; if (!k) return;
  const f = state.filtros;
  f.exige = e.target.checked ? [...new Set([...f.exige, k])] : f.exige.filter(x => x !== k);
  store.salvarFiltros(); render();
});
$view.addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, o = lerForm(form), err = document.getElementById("f-err");
  if (!o.titulo || !o.aluguel) { err.textContent = "Preencha pelo menos o título e o aluguel."; return; }
  const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Salvando…";
  try {
    if (state.editando) { const id = state.editando; await store.update(id, o); state.editando = null; irPara("lista"); abrirDetalhe(id); }
    else { await store.add({ ...o, status: "Novo", criado_em: new Date().toISOString() }); irPara("lista"); }
  } catch (x) {
    err.textContent = x?.code === "quota_exceeded" ? "Limite de armazenamento atingido. Remova apartamentos antigos e tente de novo." : "Não consegui salvar. Confira a conexão e tente de novo.";
    btn.disabled = false; btn.textContent = "Tentar de novo";
  }
});

let obsTimer = null, armado = false;
$sheet.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-status]"); if (!t) return;
  const id = state.aberto;
  if (t.dataset.status) { try { await store.update(id, { status: t.dataset.status }); } catch {} return; }
  if (t.dataset.act === "fechar") { armado = false; return fecharDetalhe(); }
  if (t.dataset.act === "editar") { state.editando = id; fecharDetalhe(); state.tab = "novo"; $view.dataset.tab = ""; render(); atualizarPreviaTotal(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "remover") {
    if (!armado) { armado = true; t.classList.add("armed"); t.textContent = "Toque de novo para remover"; setTimeout(() => { armado = false; if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Remover"; } }, 4000); return; }
    armado = false; fecharDetalhe(); try { await store.remove(id); } catch {}
  }
});
$sheet.addEventListener("input", e => {
  const id = e.target.dataset.obs; if (!id) return;
  const valor = e.target.value, st = document.getElementById("obs-status");
  st.textContent = "Salvando…";
  clearTimeout(obsTimer);
  obsTimer = setTimeout(async () => {
    try { await store.update(id, { observacoes: valor }); const s = document.getElementById("obs-status"); if (s) s.textContent = "Salvo"; }
    catch { const s = document.getElementById("obs-status"); if (s) s.textContent = "Não consegui salvar a observação."; }
  }, 800);
});
// Não redesenhar o detalhe enquanto a pessoa escreve observações
const _abrir = abrirDetalhe;
abrirDetalhe = function (id, silencioso) {
  if (silencioso && document.activeElement?.dataset?.obs) return;
  return _abrir(id, silencioso);
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$sheet.hidden) fecharDetalhe(); });

render();
iniciarDb();
})();
</script>
